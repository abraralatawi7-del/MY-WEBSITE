<script>
    const games = [
        {
            name: "Uncharted 4: نهاية لص",
            page: "uncharted.html"
        },
        {

            page: "tlou.html"
        },

        },
        {
           name: "Fortnite",
            page: "Fortnite.html"
          },
          {
           name: "Overwatch",
            page: "Overwatch.html"
          },
          {
          name: "Detroit: Become Human",
          page: "Detroit.html"
          }   ,
          {
    name: "Clair Obscur: Expedition 33",
    page: "ClairObscur.html"
},
{
    name: "Silent Hill 2",
    page: "SilentHill2.html"
},
{
    name: "Sekiro: Shadows Die Twice",
    page: "Sekiro.html"
},  
    ];

    function searchGames() {
        const search = document.getElementById("gameSearch").value.toLowerCase().trim();
        const results = document.getElementById("searchResults");

        if (search === "") {
            results.innerHTML = "";
            return;
        }

        const filteredGames = games.filter(game =>
            game.name.toLowerCase().includes(search)
        );

        if (filteredGames.length === 0) {
            results.innerHTML = "<p>لملم يتم العثور على اللعبة </p>";
            return;
        }

        results.innerHTML = filteredGames.map(game => `
            <a href="${game.page}" class="search-result">
                ${game.name}
            </a>
        `).join("");
    }
</script>
